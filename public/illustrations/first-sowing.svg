<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Seedling trays of young shoots lined up on a bright windowsill in March">
  <!-- wall -->
  <rect width="1200" height="800" fill="#e8ddc4"/>
  <!-- window -->
  <rect x="150" y="60" width="900" height="480" rx="8" fill="#bcd8e2" stroke="#3a352b" stroke-width="8"/>
  <rect x="150" y="60" width="900" height="480" rx="8" fill="none" stroke="#5a5244" stroke-width="14"/>
  <line x1="600" y1="60" x2="600" y2="540" stroke="#5a5244" stroke-width="12"/>
  <line x1="150" y1="300" x2="1050" y2="300" stroke="#5a5244" stroke-width="12"/>
  <!-- clouds and sun through the glass -->
  <circle cx="880" cy="180" r="70" fill="#e8c96b" opacity="0.85"/>
  <path d="M240 200 Q 300 170 360 200 T 480 200" fill="none" stroke="#f2ede0" stroke-width="22" stroke-linecap="round"/>
  <path d="M660 250 Q 720 220 780 250 T 900 250" fill="none" stroke="#f2ede0" stroke-width="22" stroke-linecap="round"/>
  <path d="M260 430 Q 340 400 420 430" fill="none" stroke="#9db87a" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- sill -->
  <rect x="90" y="540" width="1020" height="42" rx="6" fill="#c9a briefly"/>
  <rect x="90" y="540" width="1020" height="42" rx="6" fill="#cfa972" stroke="#3a352b" stroke-width="6"/>
  <rect x="110" y="582" width="980" height="30" rx="4" fill="#a3794e"/>

  <!-- tray 1 -->
  <g>
    <path d="M160 660 L 178 590 L 402 590 L 420 660 Z" fill="#8a5a30" stroke="#3a352b" stroke-width="6"/>
    <line x1="200" y1="590" x2="190" y2="660" stroke="#3a352b" stroke-width="4"/>
    <line x1="290" y1="590" x2="290" y2="660" stroke="#3a352b" stroke-width="4"/>
    <line x1="380" y1="590" x2="390" y2="660" stroke="#3a352b" stroke-width="4"/>
    <g stroke="#3a352b" stroke-width="4">
      <path d="M225 590 Q 220 540 200 520" fill="#7a9a5a"/>
      <path d="M225 590 Q 232 538 252 522" fill="#7a9a5a"/>
      <path d="M330 590 Q 324 540 306 522" fill="#7a9a5a"/>
      <path d="M330 590 Q 338 538 356 524" fill="#7a9a5a"/>
    </g>
    <circle cx="196" cy="516" r="9" fill="#7a9a5a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="256" cy="518" r="9" fill="#7a9a5a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="302" cy="518" r="9" fill="#7a9a5a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="360" cy="520" r="9" fill="#7a9a5a" stroke="#3a352b" stroke-width="4"/>
  </g>

  <!-- tray 2 -->
  <g>
    <path d="M470 668 L 488 596 L 712 596 L 730 668 Z" fill="#8a5a30" stroke="#3a352b" stroke-width="6"/>
    <line x1="510" y1="596" x2="500" y2="668" stroke="#3a352b" stroke-width="4"/>
    <line x1="600" y1="596" x2="600" y2="668" stroke="#3a352b" stroke-width="4"/>
    <line x1="690" y1="596" x2="700" y2="668" stroke="#3a352b" stroke-width="4"/>
    <g fill="#8fae6a" stroke="#3a352b" stroke-width="4">
      <path d="M535 596 Q 528 550 512 534"/>
      <path d="M535 596 Q 544 548 560 536"/>
      <path d="M640 596 Q 632 550 616 536"/>
      <path d="M640 596 Q 650 548 666 538"/>
    </g>
    <circle cx="508" cy="530" r="9" fill="#8fae6a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="564" cy="532" r="9" fill="#8fae6a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="612" cy="532" r="9" fill="#8fae6a" stroke="#3a352b" stroke-width="4"/>
    <circle cx="670" cy="534" r="9" fill="#8fae6a" stroke="#3a352b" stroke-width="4"/>
  </g>

  <!-- tray 3, just sown, nothing up yet -->
  <g>
    <path d="M780 664 L 798 592 L 1022 592 L 1040 664 Z" fill="#8a5a30" stroke="#3a352b" stroke-width="6"/>
    <line x1="820" y1="592" x2="810" y2="664" stroke="#3a352b" stroke-width="4"/>
    <line x1="910" y1="592" x2="910" y2="664" stroke="#3a352b" stroke-width="4"/>
    <line x1="1000" y1="592" x2="1010" y2="664" stroke="#3a352b" stroke-width="4"/>
    <circle cx="855" cy="640" r="7" fill="#5a4028"/>
    <circle cx="905" cy="648" r="7" fill="#5a4028"/>
    <circle cx="955" cy="636" r="7" fill="#5a4028"/>
  </g>

  <!-- labels -->
  <g>
    <rect x="196" y="676" width="150" height="34" rx="6" fill="#f7f1de" stroke="#3a352b" stroke-width="4" transform="rotate(-3 271 693)"/>
    <rect x="512" y="682" width="150" height="34" rx="6" fill="#f7f1de" stroke="#3a352b" stroke-width="4" transform="rotate(2 587 699)"/>
    <rect x="826" y="678" width="150" height="34" rx="6" fill="#f7f1de" stroke="#3a352b" stroke-width="4" transform="rotate(-2 901 695)"/>
  </g>
</svg>
