<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A trug heaped with ripe tomatoes sitting on the edge of a raised bed in September">
  <!-- backdrop -->
  <rect width="1200" height="800" fill="#e9dfc8"/>
  <!-- bean fence behind -->
  <g stroke="#8a6a45" stroke-width="10">
    <line x1="120" y1="120" x2="120" y2="470"/>
    <line x1="380" y1="120" x2="380" y2="470"/>
    <line x1="640" y1="120" x2="640" y2="470"/>
    <line x1="900" y1="120" x2="900" y2="470"/>
    <line x1="1120" y1="120" x2="1120" y2="470"/>
    <line x1="60" y1="200" x2="1160" y2="188"/>
    <line x1="60" y1="330" x2="1160" y2="320"/>
    <line x1="60" y1="452" x2="1160" y2="446"/>
  </g>
  <!-- vines on the fence -->
  <g fill="#6a8a4a" stroke="#3a352b" stroke-width="5">
    <path d="M240 300 Q 300 250 360 280 Q 310 320 244 316 Z"/>
    <path d="M500 220 Q 560 180 620 210 Q 570 250 504 240 Z"/>
    <path d="M770 330 Q 830 280 890 310 Q 840 350 774 346 Z"/>
    <path d="M960 200 Q 1010 160 1064 186 Q 1020 226 964 216 Z"/>
  </g>
  <g stroke="#5a7a3a" stroke-width="6" fill="none">
    <path d="M80 420 Q 240 380 400 410 T 760 402 T 1140 396"/>
    <path d="M150 300 Q 300 330 460 296 T 780 306 T 1100 288"/>
  </g>

  <!-- raised bed edge -->
  <rect x="0" y="560" width="1200" height="120" fill="#6b4f35" stroke="#3a352b" stroke-width="6"/>
  <rect x="0" y="548" width="1200" height="24" rx="8" fill="#8a6a45" stroke="#3a352b" stroke-width="6"/>
  <path d="M0 680 L 1200 680 L 1200 800 L 0 800 Z" fill="#4a3520"/>

  <!-- trug -->
  <g>
    <path d="M300 400 L 360 720 Q 366 756 404 756 L 796 756 Q 834 756 840 720 L 900 400 Z" fill="#c98a4a" stroke="#3a352b" stroke-width="8"/>
    <path d="M300 400 L 900 400 L 884 470 L 316 470 Z" fill="#a86a30" stroke="#3a352b" stroke-width="7"/>
    <!-- weave lines -->
    <g stroke="#8a5a26" stroke-width="5" fill="none" opacity="0.9">
      <path d="M330 500 L 872 496"/>
      <path d="M340 560 L 862 556"/>
      <path d="M352 620 L 852 618"/>
      <path d="M364 680 L 842 678"/>
      <path d="M440 480 L 452 740"/>
      <path d="M600 476 L 600 742"/>
      <path d="M760 480 L 750 740"/>
    </g>
    <!-- handle -->
    <path d="M420 400 Q 600 260 780 400" fill="none" stroke="#3a352b" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- tomato truss hanging into frame -->
  <g>
    <path d="M1040 60 Q 1030 180 1006 260" fill="none" stroke="#5a7a3a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="1004" cy="286" r="52" fill="#c94f3d" stroke="#3a352b" stroke-width="6"/>
    <circle cx="1044" cy="212" r="40" fill="#d86a3a" stroke="#3a352b" stroke-width="6"/>
    <path d="M1004 240 L 1004 332 M 958 286 L 1050 286" stroke="#a83a2a" stroke-width="4" opacity="0.6"/>
    <path d="M1004 236 L 984 220 L 1000 216 L 1004 200 L 1012 216 L 1026 220 Z" fill="#5a7a3a" stroke="#3a352b" stroke-width="4"/>
  </g>

  <!-- heap of tomatoes -->
  <g stroke="#3a352b" stroke-width="6">
    <circle cx="470" cy="380" r="58" fill="#c94f3d"/>
    <circle cx="600" cy="360" r="64" fill="#d86a3a"/>
    <circle cx="730" cy="382" r="58" fill="#c94f3d"/>
    <circle cx="540" cy="318" r="50" fill="#d86a3a"/>
    <circle cx="668" cy="312" r="52" fill="#b8402e"/>
    <circle cx="600" cy="430" r="56" fill="#c94f3d"/>
    <circle cx="452" cy="448" r="50" fill="#b8402e"/>
    <circle cx="760" cy="448" r="52" fill="#d86a3a"/>
  </g>
  <!-- calyx stars -->
  <g fill="#5a7a3a" stroke="#3a352b" stroke-width="4">
    <path d="M600 300 L 588 282 L 604 286 L 600 266 L 612 284 L 626 280 L 616 298 Z"/>
    <path d="M540 272 L 530 258 L 542 260 L 540 244 L 550 258 L 562 256 L 552 270 Z"/>
    <circle cx="770" cy="358" r="9"/>
  </g>
  <!-- highlights -->
  <g fill="#f2d8c8" opacity="0.8">
    <ellipse cx="480" cy="362" rx="14" ry="9" transform="rotate(-30 480 362)"/>
    <ellipse cx="580" cy="342" rx="15" ry="10" transform="rotate(-24 580 342)"/>
    <ellipse cx="712" cy="364" rx="13" ry="9" transform="rotate(-28 712 364)"/>
  </g>
</svg>
